 const pila=new T.Group();pila.position.set(-14,0,0);box(pila,5,.5,6,0xa0825f,0,.25,0);for(let i=0;i<3;i++)for(let j=0;j<3;j++){const s=saco();s.position.set(i*1.4-1.4,1.1,j*1.7-1.7);pila.add(s)}sc.add(pila);
 const cm=camion(0x2980b9,true);cm.rotation.y=-Math.PI/2;cm.position.set(14.6,0,0);sc.add(cm);
 const p=jugador();p.position.set(-8,0,8);sc.add(p);let n=0,tiene=false,t=0;
 const fk=[-3,5,-8,9].slice(0,DIF.fn).map((fx,i)=>{const m=montacargas();m.position.set(fx,0,i?-8:8);sc.add(m);return{m,d:i?1:-1,v:(5+i*2)*DIF.fk}});
 bars([['b','Sacos cargados 0/'+DIF.sk]]);hint('Mueve al operador (flechas / WASD). Lleva '+DIF.sk+' bultos de café al camión y esquiva los montacargas.');
 return dt=>{t+=dt;let dx=(RT()?1:0)-(LF()?1:0),dz=(DN()?1:0)-(UP()?1:0);const l=Math.hypot(dx,dz);
  if(l){dx/=l;dz/=l;const v=tiene?10:15;p.position.x=Math.max(-21,Math.min(21,p.position.x+dx*v*dt));p.position.z=Math.max(-14,Math.min(14,p.position.z+dz*v*dt));
   let d=Math.atan2(dx,dz)-p.rotation.y;d=Math.atan2(Math.sin(d),Math.cos(d));p.rotation.y+=d*Math.min(1,12*dt);p.position.y=Math.abs(Math.sin(t*12))*.15}else p.position.y=0;

  cam_(x*.5,22,z*.4+17,x*.5,0,z*.4)}}
// ---------- ETAPAS 2 y 7: CONDUCCIÓN ----------
function drive(intl){sc=escena(intl?0xf5b57a:0x87ceeb,260);box(sc,200,.2,400,intl?0x7a9e5a:0x64b464,0,-.1,-120);box(sc,22,.25,400,0x2d3436,0,0,-120);

 const tk=camion(intl?0x6f4e37:0x2980b9);sc.add(tk);let x=0,dist=0,fuel=100,tm=0,tb=2,lx=0;const it=[],META=640*DIF.dist;
 bars([['pg','Progreso'],['fu','Combustible']]);hint('←→ / A D para esquivar rocas · ↑ acelera, ↓ frena · Recoge bidones rojos.');
 return dt=>{const v=24+(UP()?10:0)-(DN()?8:0),tx=(RT()?1:0)-(LF()?1:0);x=Math.max(-8.6,Math.min(8.6,x+tx*14*dt));tk.position.x=x;tk.rotation.y+=(-tx*.15-tk.rotation.y)*Math.min(1,8*dt);
  dist+=v*dt;fuel-=2.6*DIF.fu*dt*v/24;if(fuel<=0)return perder();
  da.forEach(d=>{d.position.z+=v*dt;if(d.position.z>14)d.position.z-=240});tr.forEach(a=>{a.position.z+=v*dt;if(a.position.z>12)a.position.z-=260});
  tm-=dt;if(tm<=0){tm=rnd(.5,.95)/DIF.rk;const nx=rnd(-8,8);if(it.filter(o=>o.k=='r').length<Math.round(9+(DIF.rk-1)*6)&&Math.abs(nx-lx)>3.5){lx=nx;const m=rock();m.position.set(nx,0,-135);sc.add(m);it.push({m,k:'r',vx:rnd(-3.5,3.5)})}}
  tb-=dt;if(tb<=0){tb=rnd(2.5,5);const m=new T.Group();box(m,.9,1.3,.9,0xc0392b,0,.8,0);box(m,.4,.3,.4,0xf1c40f,0,1.6,0);m.position.set(rnd(-8,8),0,-135);sc.add(m);it.push({m,k:'b'})}
  for(const o of it.slice()){const p=o.m.position;p.z+=v*dt;if(o.k=='b')o.m.rotation.y+=3*dt;else{p.x+=o.vx*dt;if(Math.abs(p.x)>9.2)o.vx*=-1;o.m.rotation.x-=v*dt*.25}
   if(Math.abs(p.x-x)<1.7&&Math.abs(p.z)<2.6){if(o.k=='r')return perder();fuel=Math.min(100,fuel+40);sfx('click');sc.remove(o.m);it.splice(it.indexOf(o),1)}
   else if(p.z>10){sc.remove(o.m);it.splice(it.indexOf(o),1)}}
  fill('pg',dist/META);fill('fu',fuel/100);$('fu').style.background=fuel>40?'#27ae60':'#c0392b';if(dist>=META)return avanzar();
  cam_(x*.5,6.5,13,x*.7,1.5,-14)}}
// ---------- ETAPA 3: DOCUMENTOS ----------

 const D=["RUT","Factura Comercial","Lista de Empaque","Registro Exp","Decl. Exportación","Cert. Origen"],pr=D.map(()=>0),pp=[];let ok=0;
 $('pn').innerHTML=D.map((d,i)=>`<div class=doc data-i=${i}><i></i><span>${d}</span></div>`).join('')+'<div id=nx></div>';

   if(pr[i]>=100){sfx('correcto');els[i].classList.add('ok');els[i].lastChild.textContent=D[i]+' (Aprobado)';
    const g=new T.Group();box(g,4,.1,5.4,0xffffff,0,0,0);box(g,2.6,.12,.3,0x95a5a6,0,0,-1.2);box(g,1,.14,1,0xc0392b,1,0,1.4);
    g.position.set((i%3-1)*5.6,7,(i<3?-1:1)*3.2);g.rotation.y=rnd(-.25,.25);sc.add(g);pp.push(g);ok++;fill('pg',ok/6);txt('pg','Documentos '+ok+'/6');if(ok==6)nxt('Generar Manifiesto →')}}
  pp.forEach(g=>g.position.y+=(.1-g.position.y)*Math.min(1,8*dt))}}
// ---------- ETAPA 4: ADUANA ORIGEN ----------
function s3(){sc=escena(0xc8dce6);box(sc,80,.4,50,0x7f8c8d,0,-.2,0);const g=new T.Group();g.position.y=3;sc.add(g);box(g,9,4.4,4.4,0x1e6496,0,0,0);
 for(let i=-4;i<=4;i++)box(g,.14,4.2,4.7,0x185a85,i,0,0);box(g,.3,4.6,4.6,0x154c70,4.5,0,0);
 const pc=[],sx=[-3.2,-1.1,1.1,3.2,0];let n=0;for(let i=0;i<5;i++){const m=ico(g,.5,0xc0392b,sx[i],rnd(-1.4,1.4),i<3?2.5:-2.5);m.scale.setScalar(1.1);pc.push(m)}

function s4(){sc=escena(0x6aa4d0,260);const sea=new T.Mesh(new T.PlaneGeometry(160,300,32,48),new T.MeshStandardMaterial({color:0x1e78b4,flatShading:true,roughness:.6}));
 sea.rotation.x=-Math.PI/2;sea.position.z=-100;sea.receiveShadow=true;sc.add(sea);const P=sea.geometry.attributes.position;
 const sh=barco();sc.add(sh);let x=0,dist=0,t=0,tb=1,fl=0;const it=[],META=700*DIF.dist;
 bars([['pg','Travesía']]);hint('←→ / A D para esquivar tormentas · ↑ acelera, ↓ frena.');
 return dt=>{t+=dt;const v=26+(UP()?8:0)-(DN()?8:0),tx=(RT()?1:0)-(LF()?1:0);x=Math.max(-16,Math.min(16,x+tx*15*dt));dist+=v*dt;
  for(let i=0;i<P.count;i++)P.setZ(i,Math.sin(P.getX(i)*.25+t*1.5)*.5+Math.sin((P.getY(i)+dist)*.15)*.5);P.needsUpdate=true;
  sh.position.set(x,.2+Math.sin(t*2)*.25,0);sh.rotation.z=Math.sin(t*1.7)*.05-tx*.1;sh.rotation.y+=(-tx*.12-sh.rotation.y)*Math.min(1,6*dt);
  tb-=dt;if(tb<=0){tb=rnd(.6,1.3)/DIF.st;const m=new T.Group();ico(m,3.2,0x3b4450,0,2.6,0).scale.set(1,.7,1);ico(m,2.2,0x2c333c,1.8,3.2,.8);ico(m,2,0x4a5562,-1.8,3,-.6);m.position.set(rnd(-16,16),0,-140);sc.add(m);it.push(m)}
  if(Math.random()<dt*.6)fl=.15;fl=Math.max(0,fl-dt);sc.userData.sun.intensity=.9+fl*8;
  for(const m of it.slice()){m.position.z+=v*dt;if(Math.abs(m.position.x-x)<3.8&&Math.abs(m.position.z)<5)return perder();if(m.position.z>20){sc.remove(m);it.splice(it.indexOf(m),1)}}
  fill('pg',dist/META);if(dist>=META)return avanzar();cam_(x*.6,8,15,x*.8,1,-16)}}
// ---------- ETAPA 6: PUERTO ----------
function s5(){sc=escena(0xb4becb,160);box(sc,40,1,30,0x184b73,-17,-.6,0);box(sc,35,1,30,0x8c8c8c,20.5,-.6,0);
 const sh=barco(false);sh.rotation.y=Math.PI/2;sh.position.set(-11,0,0);sc.add(sh);
 const cm=new T.MeshStandardMaterial({color:0xe67e22,flatShading:true}),cont=box(sc,3,1.5,1.5,cm,-11.75,2.35,0);
 const tk=camion(0x2980b9,true);tk.rotation.y=-Math.PI/2;tk.position.set(12.85,0,0);sc.add(tk);
 for(const x of[-22.5,22.5])box(sc,.9,12,.9,0x444444,x,6,0);box(sc,46,.8,1.4,0x555555,0,12,0);
 const tro=box(sc,2,.8,1.8,0xf1c40f,0,11.4,0),hk=new T.Group();sc.add(hk);box(hk,1.2,.5,.8,0xf1c40f,0,0,0);const cab=box(sc,.12,1,.12,0x141414,0,0,0);
 const ring=mesh(sc,new T.TorusGeometry(1.8,.12,6,12),0xffffff,11.75,1.5,0);ring.rotation.x=Math.PI/2;ring.visible=false;
 let hx=0,hy=10,es='E',fin=0;const TG=-11.75,TD=11.75;
 hint('← → mueve la grúa · ESPACIO agarra/suelta cuando estés alineado.');
 return dt=>{const mv=(RT()?1:0)-(LF()?1:0);
  if(es=='E'||es=='L'){hx=Math.max(-20,Math.min(20,hx+mv*12*dt));const t=es=='E'?TG:TD,al=Math.abs(hx-t)<2*DIF.tol;
   if(es=='E')cm.emissive.setHex(al?0x663300:0);else ring.material=mat(al?0x27ae60:0xffffff);
   if(SP){SP=0;if(al){sfx('click');es=es=='E'?'BB':'BC';cm.emissive.setHex(0)}else return perder()}}
  else if(es=='BB'){hy-=12*dt;if(hy<=3.65){hy=3.65;hk.add(cont);cont.position.set(0,-1.3,0);es='SB'}}
  else if(es=='SB'){hy+=12*dt;if(hy>=10){hy=10;es='L';ring.visible=true}}
  else if(es=='BC'){hy-=12*dt;if(hy<=3.4){hy=3.4;sc.add(cont);cont.position.set(hx,2.1,0);es='F';ring.visible=false}}
  else if(es=='F'){fin+=dt;if(fin>.7){es='X';return avanzar()}}
  hk.position.set(hx,hy,0);tro.position.x=hx;const L=11.4-hy;cab.scale.y=L;cab.position.set(hx,hy+L/2,0);cam_(0,10,30/Math.min(1,cam.aspect/1.7),0,5.5,0)}}

function s7(){sc=escena(0xefe6d2);box(sc,26,1,20,0x8d6e4f,0,-.5,0);box(sc,12,.2,16,0xffffff,0,.1,0);
 const g=new T.Group();cyl(g,1.5,1.7,.5,0xc0392b,0,.4,0);cyl(g,.5,.5,1.2,0x7b241c,0,1.3,0);sc.add(g);
 let x=0,z=0,vx=6*DIF.sl,vz=6*DIF.sl,n=0,t=0;bars([['pg','Sellos 0/3']]);hint('Atrapa el sello móvil con clic (0/3).');
 clickH=r=>{if(n>=3)return;if(r.intersectObject(g,true).length){n++;sfx('click');const m=cyl(sc,1.4,1.4,.05,0xc85050,x,.25,z,14);m.material=new T.MeshStandardMaterial({color:0xc85050,flatShading:true});
   vx=(Math.abs(vx)+3.5)*Math.sign(vx);vz=(Math.abs(vz)+3.5)*Math.sign(vz);fill('pg',n/3);txt('pg','Sellos '+n+'/3');hint(`Atrapa el sello móvil con clic (${n}/3).`);if(n>=3){g.visible=false;nxt('Levante →')}}};

function s8(){sc=escena(0x2d3748,130);sc.userData.sun.intensity=.6;box(sc,60,.3,60,0x3b4756,0,-.15,0);
 for(const p of[-7,7]){box(sc,60,.05,6,0x2d3436,0,.03,p);box(sc,6,.05,60,0x2d3436,p,.04,0)}
 for(let i=-3;i<=3;i++)for(const[a,b]of[[i*9,-28],[i*9,28],[-28,i*9],[28,i*9]]){const h=rnd(5,16);box(sc,6,h,6,[0x4a5568,0x5a6b7f,0x3d4a5c][Math.abs(i)%3],a,h/2,b);box(sc,6.2,.4,6.2,0xf1c40f,a,h-1,b)}
 const mt=mesh(sc,new T.TorusGeometry(2.4,.2,6,16),0x27ae60,14,.3,-14);mt.rotation.x=Math.PI/2;
 const bm=new T.Mesh(new T.CylinderGeometry(2.3,2.3,12,12,1,true),new T.MeshBasicMaterial({color:0x27ae60,transparent:true,opacity:.3,side:T.DoubleSide}));bm.position.set(14,6,-14);sc.add(bm);
 const tk=camion(0x2980b9);tk.position.set(-16,0,16);sc.add(tk);let x=-16,z=16,t=0;
 const fk=[{x:-2,d:1},{x:8,d:-1},{x:3,d:1},{x:-9,d:-1}].slice(0,Math.min(DIF.fn,4)).map(f=>{const m=montacargas();m.position.set(f.x,0,rnd(-12,12));sc.add(m);f.m=m;return f});

 return dt=>{t+=dt;let dx=(RT()?1:0)-(LF()?1:0),dz=(DN()?1:0)-(UP()?1:0);const l=Math.hypot(dx,dz);
  if(l){dx/=l;dz/=l;x=Math.max(-20,Math.min(20,x+dx*11*dt));z=Math.max(-20,Math.min(20,z+dz*11*dt));let d=Math.atan2(-dx,-dz)-tk.rotation.y;d=Math.atan2(Math.sin(d),Math.cos(d));tk.rotation.y+=d*Math.min(1,10*dt)}
